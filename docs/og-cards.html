<!DOCTYPE html>
<!--
  游戏分享图生成模板（1200×630）
  用法：本地起服务后访问 /docs/og-cards.html?g=sudoku|g2048|minesweeper|jigsaw|match3|snake|sokoban|npuzzle|tetris|breakout|linkup|memory|gomoku|mario，截整页即可。
  新增游戏时，在 script 里的 CONF 加一项，并在下方追加对应的 art 分支。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Instrument Sans';
    font-style: normal;
    font-weight: 400 600;
    src: url('../assets/fonts/instrument-sans-latin.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    font-family: 'Instrument Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #F7F3EA;
    color: #454B59;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 右侧柔光斑，颜色跟着游戏走 */
  .glow {
    position: absolute;
    right: -90px;
    top: 40px;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: var(--glow);
    filter: blur(4px);
  }

  .brand {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand__mark {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: #6B7AC2;
    color: #FFFDF8;
    display: grid;
    place-items: center;
    font-size: 26px;
    font-weight: 600;
  }

  .brand__text strong {
    display: block;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  .brand__text em {
    display: block;
    margin-top: 2px;
    font-style: normal;
    font-size: 15px;
    color: #8E93A0;
  }

  .body {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 40px;
  }

  .copy {
    flex: 1 1 auto;
    min-width: 0;
  }

  h1 {
    font-size: 86px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -.02em;
  }

  h1 small {
    display: block;
    margin-top: 8px;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: .06em;
    color: #9AA0AC;
  }

  .copy p {
    margin-top: 22px;
    font-size: 26px;
    line-height: 1.55;
    color: #6C727F;
    max-width: 520px;
  }

  .art {
    flex: 0 0 auto;
    width: 360px;
    height: 360px;
    display: grid;
    place-items: center;
  }

  /* 推箱子：一块小棋盘，一格一格画出来 */
  .soko {
    display: grid;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 16px 34px rgba(69, 75, 89, .16);
  }

  .soko i {
    position: relative;
    width: 36px;
    height: 36px;
    display: block;
  }

  .soko i.w {
    background: linear-gradient(158deg, #D3C4A9, #C2B08F);
    box-shadow: inset 0 1px 0 rgba(255, 253, 248, .28);
  }

  .soko i.f {
    background: #F7F0E3;
    box-shadow: inset 0 0 0 1px rgba(120, 104, 78, .05);
  }

  .soko u {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
  }

  .soko u.goal {
    width: 12px;
    height: 12px;
    border: 1.5px dashed #B99A8F;
    border-radius: 50%;
  }

  .soko u.box {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: linear-gradient(158deg, #CBA9A2, #B98F86);
    box-shadow: inset 0 0 0 2px rgba(255, 253, 248, .4), 0 2px 5px rgba(120, 84, 76, .22);
  }

  .soko u.box.on {
    background: linear-gradient(158deg, #B2C8B7, #8FA88C);
    box-shadow: inset 0 0 0 2px rgba(255, 253, 248, .45), 0 2px 5px rgba(95, 127, 104, .2);
  }

  .soko u.man {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 26%, #909CDB 0%, #6B7AC2 58%, #58659F 100%);
    box-shadow: 0 2px 5px rgba(60, 70, 110, .28);
  }

  .foot {
    position: relative;
    font-size: 18px;
    letter-spacing: .06em;
    color: #A9AEBA;
  }

  /* ---------------- 数字华容道 ---------------- */
  .npz {
    display: grid;
    grid-template-columns: repeat(3, 92px);
    grid-auto-rows: 92px;
    gap: 8px;
  }

  .npz i {
    display: grid;
    place-items: center;
    font-style: normal;
    font-size: 40px;
    font-weight: 600;
    color: #57503F;
    background: linear-gradient(158deg, #FFFDF8, #F7EFE0);
    border: 1px solid #EADFCB;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(120, 104, 78, .13);
  }

  .npz i.gap {
    background: rgba(120, 104, 78, .07);
    border-color: transparent;
    box-shadow: inset 0 3px 8px rgba(120, 104, 78, .13);
  }

  /* 正在往空格里滑的那一块，往左压过去一点，影子落在空格上才有动的感觉 */
  .npz i.moving {
    transform: translateX(-46px) rotate(-3deg);
    box-shadow: 0 14px 26px rgba(120, 104, 78, .26);
  }

  /* ---------------- 数独 ---------------- */
  .grid9 {
    width: 330px;
    height: 330px;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    background: #FFFDF8;
    border: 3px solid #6B7AC2;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(107, 122, 194, .16);
  }

  .grid9 span {
    display: grid;
    place-items: center;
    font-size: 21px;
    font-weight: 500;
    color: #55639F;
    border-right: 1px solid #E4E7F3;
    border-bottom: 1px solid #E4E7F3;
  }

  .grid9 span:nth-child(9n) { border-right: 0; }
  .grid9 span:nth-child(n+73) { border-bottom: 0; }

  /* 九宫粗线 */
  .grid9 span:nth-child(3n) { border-right: 2px solid #B9C1E4; }
  .grid9 span:nth-child(9n) { border-right: 0; }
  .grid9 span:nth-child(n+19):nth-child(-n+27),
  .grid9 span:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #B9C1E4; }

  /* ---------------- 2048 ---------------- */
  .tiles {
    width: 330px;
    height: 330px;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    background: #EDE4D4;
    border-radius: 20px;
    box-shadow: 0 18px 40px rgba(160, 140, 110, .16);
  }

  .tiles span {
    display: grid;
    place-items: center;
    border-radius: 10px;
    font-size: 38px;
    font-weight: 600;
    letter-spacing: -.02em;
  }

  .t0 { background: rgba(255, 253, 248, .55); }

  .t2  { background: #FBF6EC; color: #6B6152; }
  .t4  { background: #F1E4CE; color: #6B6152; }
  .t8  { background: #E7CFA8; color: #FFFDF8; }
  .t16 { background: #D8B87E; color: #FFFDF8; }
  .t32 { background: #C9A25F; color: #FFFDF8; }

  /* ---------------- 扫雷 ---------------- */
  .mine {
    width: 330px;
    height: 330px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 6px;
    background: #FFFDF8;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(120, 145, 128, .18);
  }

  .mine span {
    display: grid;
    place-items: center;
    border-radius: 8px;
    font-size: 26px;
    font-weight: 600;
    background: #DCE8DF;
    color: #4F6B5B;
  }

  .mine span.on {
    background: #FBF6EC;
    border: 1px solid #EDE4D4;
  }

  .mine span.n1 { color: #5C7BB0; }
  .mine span.n2 { color: #6E8F7B; }
  .mine span.n3 { color: #A9736A; }
  /* ---------------- 拼图 ---------------- */
  .jig {
    width: 330px;
    height: 330px;
    padding: 9px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    background: #FFFDF8;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(195, 162, 158, .22);
  }

  .jig i {
    display: block;
    border-radius: 7px;
  }

  .jig i.loose {
    z-index: 2;
    transform: translate(16%, -10%) rotate(8deg) scale(.94);
    box-shadow: 0 10px 22px rgba(69, 75, 89, .2);
  }

  /* ---------------- 消消乐 ---------------- */
  .m3 {
    width: 330px;
    height: 330px;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: #FFFDF8;
    border-radius: 20px;
    box-shadow: 0 18px 40px rgba(220, 196, 155, .26);
  }

  .m3 span {
    display: grid;
    place-items: center;
  }

  .m3 svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ---------------- 贪吃蛇 ---------------- */
  .sn {
    width: 330px;
    height: 330px;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 2px;
    background: #E7DCC8;
    border-radius: 20px;
    box-shadow: 0 18px 40px rgba(126, 155, 132, .24);
  }

  .sn b {
    display: block;
    border-radius: 30%;
    background: transparent;
  }

  .sn b.b {
    background: #7E9B84;
  }

  .sn b.h {
    background: #5F7F68;
  }

  .sn b.f {
    background: #C0806F;
    border-radius: 50%;
    transform: scale(.82);
  }

  /* ---------------- 俄罗斯方块 [gyh 2026-11-08 新增] ---------------- */
  .tet {
    width: 240px;
    height: 320px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(16, 1fr);
    gap: 2px;
    background: #EDF1F4;
    border: 2px solid #C9D3DE;
    border-radius: 14px;
    box-shadow: 0 18px 40px rgba(110, 127, 155, .2);
  }

  .tet i { display: block; border-radius: 3px; }
  .tet i.a { background: #8FA6BE; }
  .tet i.b { background: #C0897A; }
  .tet i.c { background: #D8A98C; }
  .tet i.d { background: #9FB8A8; }

  /* ---------------- 打砖块 [gyh 2026-11-08 新增] ---------------- */
  .brk {
    position: relative;
    width: 320px;
    height: 320px;
    border-radius: 18px;
    background: #FBF5EE;
    box-shadow: 0 18px 40px rgba(192, 137, 122, .2);
    overflow: hidden;
  }

  .brk .row {
    position: absolute;
    left: 22px;
    right: 22px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
  }

  .brk .row i { display: block; height: 16px; border-radius: 4px; }

  .brk .paddle {
    position: absolute;
    left: 118px;
    bottom: 26px;
    width: 84px;
    height: 12px;
    border-radius: 7px;
    background: #8FA6BE;
  }

  .brk .ball {
    position: absolute;
    left: 152px;
    bottom: 74px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #C0897A;
  }

  /* ---------------- 连连看 [gyh 2026-11-08 新增] ---------------- */
  .lk {
    position: relative;
    width: 320px;
    height: 240px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    background: #E6F1EC;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(107, 156, 144, .22);
  }

  .lk i {
    display: block;
    border-radius: 9px;
    background: #FFFDF8;
    border: 1px solid #CDE3D8;
  }

  .lk i.hi {
    background: #8CB8AC;
    border-color: #6B9C90;
  }

  .lk .wire {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ---------------- 记忆翻牌 [gyh 2026-11-08 新增] ---------------- */
  .mm {
    width: 300px;
    height: 300px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    background: #F0EBF5;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(136, 120, 180, .22);
  }

  .mm i {
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: #8878B4;
    font-style: normal;
    font-size: 30px;
    color: #FFFDF8;
  }

  .mm i.open {
    background: #FFFDF8;
    border: 1px solid #D8CFE8;
    color: #8878B4;
  }

  /* ---------------- 五子棋 [gyh 2026-11-08 新增] ---------------- */
  .gmk {
    position: relative;
    width: 310px;
    height: 310px;
    border-radius: 14px;
    background-color: #EDEDE8;
    background-image:
      linear-gradient(to right, rgba(127, 123, 110, .32) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(127, 123, 110, .32) 1px, transparent 1px);
    background-size: 31px 31px;
    background-position: 15px 15px;
    box-shadow: 0 18px 40px rgba(127, 123, 110, .2);
  }

  .gmk u {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .gmk u.b { background: #4A4A46; }
  .gmk u.w { background: #FFFDF8; border: 1px solid #C9C5BA; }

  /* ---------------- 经典马里奥 [gyh 2026-11-08 新增] ---------------- */
  .mro {
    position: relative;
    width: 330px;
    height: 260px;
    border-radius: 18px;
    background: #F5EAEC;
    box-shadow: 0 18px 40px rgba(172, 126, 140, .22);
    overflow: hidden;
  }

  .mro .ground {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 46px;
    background: #C89AA6;
  }

  .mro .block {
    position: absolute;
    width: 38px;
    height: 38px;
    border-radius: 7px;
    background: #AC7E8C;
    color: #FFFDF8;
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 600;
  }

  .mro .hero {
    position: absolute;
    width: 30px;
    height: 42px;
    border-radius: 8px 8px 5px 5px;
    background: #8CB8AC;
  }

  .mro .pole {
    position: absolute;
    right: 46px;
    bottom: 46px;
    width: 6px;
    height: 150px;
    background: #A6A296;
  }

  .mro .flag {
    position: absolute;
    right: 52px;
    bottom: 168px;
    width: 0;
    height: 0;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
    border-left: 26px solid #8CB8AC;
  }

</style>
</head>
<body>
  <div class="card">
    <div class="glow" id="glow"></div>

    <div class="brand">
      <span class="brand__mark">Y</span>
      <span class="brand__text">
        <strong>YSGame</strong>
        <em>云舒的小游戏屋</em>
      </span>
    </div>

    <div class="body">
      <div class="copy">
        <h1 id="title"></h1>
        <p id="sub"></p>
      </div>
      <div class="art" id="art"></div>
    </div>

    <div class="foot">ysgame.xyz</div>
  </div>

<script>
  var CONF = {
    sudoku: {
      glow: 'rgba(107,122,194,.10)',
      title: '数独<small>SUDOKU</small>',
      sub: '五种难度，一格一格把秩序填回来'
    },
    g2048: {
      glow: 'rgba(216,184,126,.20)',
      title: '2048<small>SLIDE &amp; MERGE</small>',
      sub: '滑两下就上手，看看你能叠到多少'
    },
    minesweeper: {
      glow: 'rgba(159,184,168,.22)',
      title: '扫雷<small>MINESWEEPER</small>',
      sub: '第一次点击，永远不会踩雷'
    },
    jigsaw: {
      glow: 'rgba(195,162,158,.20)',
      title: '拼图<small>JIGSAW</small>',
      sub: '一块一块，把画面拼回原来的样子'
    },
    match3: {
      glow: 'rgba(220,196,155,.24)',
      title: '消消乐<small>MATCH THREE</small>',
      sub: '三颗同色连成一线，看着它们一个个消失'
    },
    snake: {
      glow: 'rgba(126,155,132,.22)',
      title: '贪吃蛇<small>SNAKE</small>',
      sub: '一条线，一个方向，越吃越长'
    },
    sokoban: {
      glow: 'rgba(198,180,146,.24)',
      title: '推箱子<small>SOKOBAN</small>',
      sub: '只能推不能拉，推错了还能撤销一步'
    },
    npuzzle: {
      glow: 'rgba(169,183,160,.26)',
      title: '数字华容道<small>NUMBER SLIDE</small>',
      sub: '把数字排回去，只留一个空格'
    },
    // [gyh 2026-11-08 新增] 俄罗斯方块 / 打砖块
    tetris: {
      glow: 'rgba(143,166,190,.22)',
      title: '俄罗斯方块<small>TETRIS</small>',
      sub: '七种方块落下来，转一转，填满一行就消掉'
    },
    breakout: {
      glow: 'rgba(216,169,140,.22)',
      title: '打砖块<small>BREAKOUT</small>',
      sub: '一块挡板，一颗球，把砖一块块敲下来'
    },
    // [gyh 2026-11-08 新增] 连连看 / 记忆翻牌 / 五子棋 / 经典马里奥
    linkup: {
      glow: 'rgba(107,156,144,.20)',
      title: '连连看<small>LINK-UP</small>',
      sub: '把相同的两张连起来，中间最多拐两个弯。牌越多越考眼力，卡住了还有提示和洗牌。'
    },
    memory: {
      glow: 'rgba(136,120,180,.20)',
      title: '记忆翻牌<small>MEMORY MATCH</small>',
      sub: '翻开两张，记住位置，把一对对找回来。步数越少越漂亮。'
    },
    gomoku: {
      glow: 'rgba(127,123,110,.20)',
      title: '五子棋<small>GOMOKU</small>',
      sub: '十五路棋盘，和电脑轮流落子。先连成五子的一方赢。'
    },
    mario: {
      glow: 'rgba(172,126,140,.20)',
      title: '经典马里奥<small>MARIO</small>',
      sub: '一路向右跑，跳过缺口、踩掉小怪、捡起金币，摸到旗杆就过关。'
    }
  };

  var key = new URLSearchParams(location.search).get('g') || 'sudoku';
  var c = CONF[key] || CONF.sudoku;

  document.getElementById('glow').style.background = c.glow;
  document.getElementById('title').innerHTML = c.title;
  document.getElementById('sub').textContent = c.sub;

  var art = document.getElementById('art');

  if (key === 'sudoku') {
    var nums = [5,3,0,0,7,0,0,0,0, 6,0,0,1,9,5,0,0,0, 0,9,8,0,0,0,0,6,0,
                8,0,0,0,6,0,0,0,3, 4,0,0,8,0,3,0,0,1, 7,0,0,0,2,0,0,0,6,
                0,6,0,0,0,0,2,8,0, 0,0,0,4,1,9,0,0,5, 0,0,0,0,8,0,0,7,9];
    var g = document.createElement('div');
    g.className = 'grid9';
    nums.forEach(function (n) {
      var s = document.createElement('span');
      s.textContent = n ? n : '';
      g.appendChild(s);
    });
    art.appendChild(g);
  }

  if (key === 'g2048') {
    art.innerHTML = '<div class="tiles">' +
      '<span class="t2">2</span><span class="t4">4</span><span class="t8">8</span>' +
      '<span class="t0"></span><span class="t16">16</span><span class="t32">32</span>' +
      '<span class="t0"></span><span class="t0"></span><span class="t8">8</span></div>';
  }

  if (key === 'minesweeper') {
    // 1 = 已翻开空, 数字直接给, f = 旗, m = 雷, 0 = 未翻开
    var cells = [0,1,2,1,0,
                 0,1,'f',1,0,
                 1,1,1,0,0,
                 2,'f',1,0,0,
                 'm',1,0,0,0];
    var FLAG = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none">' +
      '<path d="M8.5 21.2V3.2" stroke="#5A5F6B" stroke-width="1.8" stroke-linecap="round"/>' +
      '<path d="M8.5 4.2h8.8l-2.2 3.3 2.2 3.3H8.5z" fill="#C97B6E"/></svg>';
    var MINE = '<svg viewBox="0 0 24 24" width="30" height="30">' +
      '<circle cx="12" cy="12" r="6.4" fill="#4A5060"/>' +
      '<g stroke="#4A5060" stroke-width="1.9" stroke-linecap="round">' +
      '<path d="M12 1.6v3.6M12 18.8v3.6M1.6 12h3.6M18.8 12h3.6"/>' +
      '<path d="M4.8 4.8 7.4 7.4M16.6 16.6l2.6 2.6M19.2 4.8 16.6 7.4M7.4 16.6 4.8 19.2"/></g>' +
      '<circle cx="10.2" cy="9.9" r="1.6" fill="#FFFDF8" opacity=".55"/></svg>';

    var box = document.createElement('div');
    box.className = 'mine';
    cells.forEach(function (v) {
      var s = document.createElement('span');
      if (v === 0) { s.textContent = ''; }
      else if (v === 'f') { s.innerHTML = FLAG; s.className = 'on'; }
      else if (v === 'm') { s.innerHTML = MINE; s.className = 'on'; }
      else if (v === 1) { s.className = 'on'; }
      else { s.className = 'on n' + v; s.textContent = v; }
      box.appendChild(s);
    });
    art.appendChild(box);
  }
  if (key === 'jigsaw') {
    // 上中下三层色阶拼成一幅抽象的远山，中间那块"正在放"
    var tones = ['#F6E8D7', '#F1DCC7', '#EBD1BA',
                 '#C2CFC0', '#A8BBA8', '#8FA48F',
                 '#7E987F', '#6F8774', '#5E7563'];
    var jig = document.createElement('div');
    jig.className = 'jig';
    tones.forEach(function (color, i) {
      var t = document.createElement('i');
      t.style.background = color;
      if (i === 4) t.className = 'loose';
      jig.appendChild(t);
    });
    art.appendChild(jig);
  }

  if (key === 'sokoban') {
    var MAP = [
      '#########',
      '#  * .  #',
      '#       #',
      '#  $    #',
      '#   @   #',
      '#########'
    ];
    var sb = document.createElement('div');
    sb.className = 'soko';
    sb.style.gridTemplateColumns = 'repeat(9, 36px)';
    MAP.forEach(function (row) {
      row.split('').forEach(function (ch) {
        var cell = document.createElement('i');
        if (ch === '#') {
          cell.className = 'w';
        } else {
          cell.className = 'f';
          if (ch === '.' || ch === '*') {
            cell.insertAdjacentHTML('beforeend', '<u class="goal"></u>');
          }
          if (ch === '$') {
            cell.insertAdjacentHTML('beforeend', '<u class="box"></u>');
          }
          if (ch === '*') {
            cell.insertAdjacentHTML('beforeend', '<u class="box on"></u>');
          }
          if (ch === '@') {
            cell.insertAdjacentHTML('beforeend', '<u class="man"></u>');
          }
        }
        sb.appendChild(cell);
      });
    });
    art.appendChild(sb);
  }

  if (key === 'npuzzle') {
    // 差一步拼完的局面：8 正在滑进空格
    var LAYOUT = ['1', '2', '3', '4', '5', '6', '7', '', '8'];
    var npz = document.createElement('div');
    npz.className = 'npz';
    LAYOUT.forEach(function (v) {
      var cell = document.createElement('i');
      if (!v) {
        cell.className = 'gap';
      } else {
        cell.textContent = v;
        if (v === '8') cell.className = 'moving';
      }
      npz.appendChild(cell);
    });
    art.appendChild(npz);
  }

  if (key === 'match3') {
    var SHAPES = {
      circle: '<circle cx="12" cy="12" r="9.2"/>',
      square: '<rect x="3.4" y="3.4" width="17.2" height="17.2" rx="5.4"/>',
      tri: '<path d="M12 2.8 21.4 20.4H2.6z"/>',
      dia: '<path d="M12 2.2 21.8 12 12 21.8 2.2 12z"/>',
      hex: '<path d="M12 2.4 20.6 7.4v9.2L12 21.6 3.4 16.6V7.4z"/>',
      star: '<path d="M12 1.8l3.1 6.4 7 .9-5.1 4.9 1.3 6.9L12 17.6 5.7 20.9 7 14 1.9 9.1l7-.9z"/>'
    };
    var BLUE = '#6B7AC2', CLAY = '#C3A29E', SAGE = '#9FB8A8',
        SAND = '#DCC49B', MAUVE = '#A98BA8', STEEL = '#7E9BB0';

    var layout = [
      [BLUE, 'circle'], [SAND, 'dia'], [SAGE, 'tri'], [MAUVE, 'hex'],
      [BLUE, 'circle'], [BLUE, 'circle'], [BLUE, 'circle'], [SAND, 'star'],
      [SAGE, 'hex'], [CLAY, 'square'], [MAUVE, 'star'], [STEEL, 'dia'],
      [SAND, 'square'], [SAGE, 'circle'], [CLAY, 'dia'], [BLUE, 'star']
    ];

    var m3 = document.createElement('div');
    m3.className = 'm3';
    layout.forEach(function (item) {
      var span = document.createElement('span');
      span.innerHTML = '<svg viewBox="0 0 24 24" fill="' + item[0] + '">' +
        SHAPES[item[1]] + '</svg>';
      m3.appendChild(span);
    });
    art.appendChild(m3);
  }

  if (key === 'snake') {
    var body = [[7, 1], [7, 2], [7, 3], [6, 3], [5, 3], [5, 4],
                [5, 5], [4, 5], [3, 5], [3, 6], [3, 7]];

    var sn = document.createElement('div');
    sn.className = 'sn';

    // 先铺一层空格，再用定位把蛇和果子放上去
    for (var s = 0; s < 81; s++) sn.appendChild(document.createElement('b'));

    function place(r, c, cls) {
      var cell = sn.children[(r - 1) * 9 + (c - 1)];
      cell.className = cls;
    }

    body.forEach(function (p, i) {
      place(p[0], p[1], i === body.length - 1 ? 'h' : 'b');
    });
    place(7, 7, 'f');

    art.appendChild(sn);
  }

  // [gyh 2026-11-08 新增] 俄罗斯方块：底部码好几行，留一条竖槽，上面一块 T 正在下落
  if (key === 'tetris') {
    var tet = document.createElement('div');
    tet.className = 'tet';
    for (var ti = 0; ti < 160; ti++) tet.appendChild(document.createElement('i'));

    function fill(r, c, cls) {
      tet.children[(r - 1) * 10 + (c - 1)].className = cls;
    }

    var stack = [
      [16,1,'a'],[16,2,'a'],[16,3,'b'],[16,4,'b'],[16,6,'c'],[16,7,'c'],[16,8,'d'],[16,9,'d'],[16,10,'a'],
      [15,1,'b'],[15,2,'b'],[15,4,'c'],[15,6,'d'],[15,7,'a'],[15,8,'a'],[15,9,'c'],[15,10,'b'],
      [14,1,'c'],[14,4,'d'],[14,6,'a'],[14,9,'b'],[14,10,'c']
    ];
    stack.forEach(function (p) { fill(p[0], p[1], p[2]); });
    fill(4, 5, 'd'); fill(5, 4, 'd'); fill(5, 5, 'd'); fill(5, 6, 'd');
    art.appendChild(tet);
  }

  // [gyh 2026-11-08 新增] 打砖块：四行砖、挡板、球
  if (key === 'breakout') {
    var colors = ['#C0897A', '#D8A98C', '#9FB8A8', '#8FA6BE', '#C9A79F'];
    var html = '';
    for (var bi = 0; bi < 4; bi++) {
      html += '<div class="row" style="top:' + (34 + bi * 23) + 'px">';
      for (var bj = 0; bj < 8; bj++) {
        html += '<i style="background:' + colors[(bi + bj) % colors.length] + '"></i>';
      }
      html += '</div>';
    }
    html += '<div class="paddle"></div><div class="ball"></div>';
    var brk = document.createElement('div');
    brk.className = 'brk';
    brk.innerHTML = html;
    art.appendChild(brk);
  }

  // [gyh 2026-11-08 新增] 连连看：4×3 牌阵，两张相同的牌用一条拐两弯的线连起来
  if (key === 'linkup') {
    var lk = document.createElement('div');
    lk.className = 'lk';
    for (var li = 0; li < 12; li++) lk.appendChild(document.createElement('i'));
    lk.children[2].className = 'hi';
    lk.children[9].className = 'hi';
    lk.insertAdjacentHTML('beforeend',
      '<svg class="wire" viewBox="0 0 320 240" fill="none">' +
      '<path d="M 197 47 V 20 H 123 V 192" stroke="#6B9C90" stroke-width="3" ' +
      'stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/></svg>');
    art.appendChild(lk);
  }

  // [gyh 2026-11-08 新增] 记忆翻牌：4×4 牌背，正好翻出一对
  if (key === 'memory') {
    var mm = document.createElement('div');
    mm.className = 'mm';
    for (var mi = 0; mi < 16; mi++) mm.appendChild(document.createElement('i'));
    mm.children[5].className = 'open';
    mm.children[5].textContent = '★';
    mm.children[10].className = 'open';
    mm.children[10].textContent = '★';
    art.appendChild(mm);
  }

  // [gyh 2026-11-08 新增] 五子棋：黑子先连成五，白子在旁边拦
  if (key === 'gomoku') {
    var gmk = document.createElement('div');
    gmk.className = 'gmk';
    var stones = [
      [4, 4, 'b'], [5, 4, 'b'], [6, 4, 'b'], [7, 4, 'b'], [8, 4, 'b'],
      [4, 5, 'w'], [5, 5, 'w'], [6, 5, 'w'], [7, 5, 'w']
    ];
    stones.forEach(function (p) {
      var u = document.createElement('u');
      u.className = p[2];
      u.style.left = (15 + p[0] * 31) + 'px';
      u.style.top = (15 + p[1] * 31) + 'px';
      gmk.appendChild(u);
    });
    art.appendChild(gmk);
  }

  // [gyh 2026-11-08 新增] 经典马里奥：地面、问号方块、小人和关底的旗杆
  if (key === 'mario') {
    var mro = document.createElement('div');
    mro.className = 'mro';
    mro.innerHTML =
      '<div class="ground"></div>' +
      '<div class="block" style="left:70px;bottom:130px">?</div>' +
      '<div class="block" style="left:120px;bottom:130px">?</div>' +
      '<div class="block" style="left:170px;bottom:180px">?</div>' +
      '<div class="hero" style="left:96px;bottom:46px"></div>' +
      '<div class="pole"></div><div class="flag"></div>';
    art.appendChild(mro);
  }
</script>
</body>
</html>
