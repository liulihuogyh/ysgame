  <main class="gk">

    <header class="g-head">
      <h1 class="g-title">
        <span class="g-title__mark" aria-hidden="true">⚫</span>
        <span data-i18n="game_title">五子棋</span>
      </h1>
      <p class="g-tagline" data-i18n="tagline">你执黑先手，在木纹棋盘上和电脑慢慢下一盘</p>
    </header>

    <!-- 回合 / 步数 / 最佳 / 剩余提示 -->
    <div class="g-hud gk__hud">
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_turn">回合</span>
        <strong class="hud-box__value gk__turn" id="turn">你</strong>
      </div>
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_moves">步数</span>
        <strong class="hud-box__value" id="moves">0</strong>
      </div>
      <div class="hud-box hud-box--best">
        <span class="hud-box__label" data-i18n="label_best">最佳</span>
        <strong class="hud-box__value" id="best">--</strong>
      </div>
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_hints">提示</span>
        <strong class="hud-box__value" id="hints">3</strong>
      </div>
    </div>

    <!-- 三档难度 -->
    <div class="seg gk__diffs" id="diffs" role="group" data-i18n-aria="difficulty_group_aria" aria-label="选择难度">
      <button class="seg__btn" type="button" data-diff="easy" data-i18n="diff_easy" aria-pressed="false">简单</button>
      <button class="seg__btn is-active" type="button" data-diff="medium" data-i18n="diff_medium" aria-pressed="true">中等</button>
      <button class="seg__btn" type="button" data-diff="hard" data-i18n="diff_hard" aria-pressed="false">困难</button>
    </div>

    <!-- 15×15 木纹棋盘 -->
    <div class="gk__stage">
      <canvas id="board" class="gk__board" width="556" height="556"
              role="img" data-i18n-aria="board_aria" aria-label="五子棋棋盘"></canvas>
    </div>

    <!-- 破纪录提示 -->
    <p class="gk__record" id="recordBadge" hidden data-i18n="new_record">新纪录</p>

    <!-- 主操作 -->
    <div class="gk__actions">
      <button class="g-btn g-btn--primary" id="btn-hint" type="button" data-i18n="btn_hint">提示</button>
      <button class="g-btn" id="btn-undo" type="button" data-i18n="btn_undo">悔棋</button>
      <button class="g-btn" id="btn-restart" type="button" data-i18n="btn_restart">重开一局</button>
    </div>

    <!-- 结算卡片 -->
    <div class="result" id="overlay" hidden>
      <div class="result__top">
        <div class="result__text">
          <h2 class="result__title" id="overlay-title">你赢了</h2>
          <p class="result__sub" id="overlay-sub"></p>
        </div>
        <p class="result__stat">
          <span data-i18n="label_moves">步数</span>
          <strong id="overlay-moves">0</strong>
        </p>
      </div>
      <div class="result__actions">
        <button class="ys-share-inline" type="button" data-share-open data-i18n="share_btn">分享</button>
        <button class="g-btn g-btn--primary result__btn" id="btn-again" type="button" data-i18n="btn_again">再来一局</button>
      </div>
    </div>

    <p class="g-hint" data-i18n="hint_controls">
      点棋盘交叉处落子，你执黑先手、电脑执白。悔棋不限次数，提示每局三次，随时可以重开。
    </p>

    <!-- 广告位 -->
    <div class="ad-container">
      <div class="ad-placeholder" data-i18n="ad_placeholder">广告位（申请 AdSense 后替换）</div>
    </div>
