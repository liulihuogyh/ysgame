      </button>
    </div>

  <main class="gm3">

    <header class="g-head">
      <h1 class="g-title">
        <span class="g-title__mark" aria-hidden="true">🍬</span>
        <span data-i18n="game_title">消消乐</span>
      </h1>
      <p class="g-tagline" data-i18n="tagline">三颗同色连成一线，看着它们一个个消失</p>
    </header>

    <!-- 难度选择 -->
    <div class="seg gm3__diffs" id="diffs" role="group" data-i18n-aria="difficulty_group_aria" aria-label="选择难度">
      <button class="seg__btn" type="button" data-diff="easy" data-i18n="diff_easy">简单</button>
      <button class="seg__btn is-active" type="button" data-diff="medium" data-i18n="diff_medium">中等</button>
      <button class="seg__btn" type="button" data-diff="hard" data-i18n="diff_hard">困难</button>
    </div>

    <!-- 分数 / 步数 / 最佳 -->
    <div class="g-hud">
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_score">分数</span>
        <strong class="hud-box__value" id="score">0</strong>
      </div>
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_moves">剩余步数</span>
        <strong class="hud-box__value" id="moves">30</strong>
      </div>
      <div class="hud-box hud-box--best">
        <span class="hud-box__label" data-i18n="label_best">最佳</span>
        <strong class="hud-box__value" id="best">0</strong>
      </div>
    </div>

    <!-- 目标进度 -->
    <div class="gm3__goal">
      <div class="gm3__goalText">
        <span data-i18n="goal_label">本局目标</span>
        <strong><span id="goal">1200</span> <span data-i18n="goal_unit">分</span></strong>
      </div>
      <div class="gm3__meter" role="progressbar" aria-valuemin="0" aria-valuemax="1200" aria-valuenow="0" id="meter">
        <i id="meter-fill"></i>
      </div>
    </div>

    <!-- 操作 -->
    <div class="gm3__bar">
      <button class="g-btn" id="btn-hint" type="button" data-i18n="btn_hint">💡 提示</button>
      <button class="g-btn g-btn--primary" id="btn-new" type="button" data-i18n="btn_new">新游戏</button>
    </div>

    <!-- 棋盘 -->
    <div class="gm3__stage">
      <div class="gm3-board" id="board" role="grid" data-i18n-aria="board_aria" aria-label="消消乐棋盘"></div>
      <div class="gm3__combo" id="combo" hidden aria-hidden="true"></div>
    </div>

    <!-- 结算卡片 -->
    <div class="result" id="overlay" hidden>
      <div class="result__top">
        <div class="result__text">
          <h2 class="result__title" id="overlay-title">过关了</h2>
          <p class="result__sub" id="overlay-sub">这一局的分够了，可以再来一局。</p>
        </div>
        <p class="result__stat">
          <span data-i18n="label_score">分数</span>
          <strong id="overlay-score">0</strong>
        </p>
      </div>
      <div class="result__actions">
        <button class="ys-share-inline" type="button" data-share-open data-i18n="share_btn">分享</button>
        <button class="g-btn g-btn--primary result__btn" id="btn-again" type="button" data-i18n="btn_again">再来一局</button>
      </div>
    </div>

    <p class="g-hint" data-i18n="hint_controls">
      点一颗，再点它上下左右相邻的一颗，两颗就交换。三颗同色连成一线就会消掉。
    </p>

    <!-- 广告位 -->
    <div class="ad-container">
      <div class="ad-placeholder" data-i18n="ad_placeholder">广告位（申请 AdSense 后替换）</div>
    </div>
