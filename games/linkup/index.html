        <button class="ys-lang" id="ysLangBtn" data-i18n="lang_btn" data-i18n-aria="lang_aria" aria-label="Switch to English">EN</button>
        <button class="ys-sound" id="ysSoundBtn" aria-label="音效">🔊</button>

        <span></span><span></span><span></span>
      </button>
    </div>

  <main class="lk">

    <header class="g-head">
      <h1 class="g-title">
        <span class="g-title__mark" aria-hidden="true">🍃</span>
        <span data-i18n="game_title">连连看</span>
      </h1>
      <p class="g-tagline" data-i18n="tagline">两张一样的图案，用一条最多拐两个弯的线连起来</p>
    </header>

    <!-- 分数 / 剩余时间 / 剩余对数 / 最高分 -->
    <div class="g-hud lk__hud">
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_score">分数</span>
        <strong class="hud-box__value" id="score">0</strong>
      </div>
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_time">时间</span>
        <strong class="hud-box__value" id="time">0</strong>
      </div>
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_remaining">剩余</span>
        <strong class="hud-box__value" id="pairs">0</strong>
      </div>
      <div class="hud-box hud-box--best">
        <span class="hud-box__label" data-i18n="label_best">最高分</span>
        <strong class="hud-box__value" id="best">--</strong>
      </div>
    </div>

    <!-- 三档难度 -->
    <div class="seg lk__diffs" id="diffs" role="group" data-i18n-aria="difficulty_group_aria" aria-label="选择难度">
      <button class="seg__btn" type="button" data-diff="easy" data-i18n="diff_easy" aria-pressed="false">简单</button>
      <button class="seg__btn is-active" type="button" data-diff="medium" data-i18n="diff_medium" aria-pressed="true">中等</button>
      <button class="seg__btn" type="button" data-diff="hard" data-i18n="diff_hard" aria-pressed="false">困难</button>
    </div>

    <!-- 棋盘（DOM 格子）+ 连线层 + 暂停遮罩 -->
    <div class="lk__boardwrap">
      <div class="lk__board" id="board" role="grid" data-i18n-aria="board_aria" aria-label="连连看棋盘"></div>
      <svg class="lk__lines" id="lines" aria-hidden="true" preserveAspectRatio="none"></svg>
      <div class="lk__veil" id="veil" hidden>
        <strong id="veilText"></strong>
      </div>
    </div>

    <!-- 主操作 -->
    <div class="lk__actions">
      <button class="g-btn g-btn--primary" id="btn-start" type="button" data-i18n="btn_start">开始</button>
      <button class="g-btn" id="btn-pause" type="button"></button>
      <button class="g-btn" id="btn-restart" type="button" data-i18n="btn_restart">重开一局</button>
      <button class="g-btn" id="btn-hint" type="button"><span data-i18n="btn_hint">提示</span> <span class="lk__count" id="hintCount"></span></button>
      <button class="g-btn" id="btn-shuffle" type="button"><span data-i18n="btn_shuffle">洗牌</span> <span class="lk__count" id="shuffleCount"></span></button>
    </div>

    <!-- 破纪录徽章 -->
    <p class="lk__record" id="recordBadge" hidden data-i18n="new_record">新纪录</p>

    <!-- 结算卡片 -->
    <div class="result" id="overlay" hidden>
      <div class="result__top">
        <div class="result__text">
          <h2 class="result__title" id="overlay-title"></h2>
          <p class="result__sub" id="overlay-sub"></p>
        </div>
        <p class="result__stat">
          <span data-i18n="label_score">分数</span>
          <strong id="overlay-score">0</strong>
        </p>
      </div>
      <div class="result__actions">
        <button class="ys-share-inline" type="button" data-share-open data-i18n="share_btn">分享</button>
        <button class="g-btn g-btn--primary result__btn" id="btn-again" type="button" data-i18n="btn_again">再来一局</button>
      </div>
    </div>

    <p class="g-hint" data-i18n="hint_controls">
      点两张一样的图案，中间最多拐两个弯就能连起来消除，还能绕棋盘外的一圈。提示帮你找一对，洗牌把剩下的重新排。
    </p>

    <!-- 广告位 -->
    <div class="ad-container">
      <div class="ad-placeholder" data-i18n="ad_placeholder">广告位（申请 AdSense 后替换）</div>
    </div>
  </main>
