        <button class="ys-sound" id="ysSoundBtn" aria-label="音效">🔊</button>
      </div>

      <button class="ys-nav__toggle" id="ysNavToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="ysNavLinks">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="soko">

    <header class="g-head">
      <h1 class="g-title">
        <span class="g-title__mark" aria-hidden="true">📦</span>
        <span data-i18n="game_title">推箱子</span>
      </h1>
      <p class="g-tagline" data-i18n="tagline">把箱子推到点上，推不回来就撤销一步</p>
    </header>

    <!-- 步数 / 用时 / 本关最佳 -->
    <div class="g-hud">
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_moves">步数</span>
        <strong class="hud-box__value" id="moves">0</strong>
      </div>
      <div class="hud-box">
        <span class="hud-box__label" data-i18n="label_time">用时</span>
        <strong class="hud-box__value" id="timer">0:00</strong>
      </div>
      <div class="hud-box hud-box--best">
        <span class="hud-box__label" data-i18n="label_best">本关最佳</span>
        <strong class="hud-box__value" id="best">--</strong>
      </div>
    </div>

    <!-- 选关 -->
    <div class="soko__levels" id="levels" role="group" data-i18n-aria="level_group_aria" aria-label="选择关卡"></div>

    <!-- 棋盘 -->
    <div class="soko__stage">
      <div class="board" id="board" tabindex="0" role="application" data-i18n-aria="board_aria" aria-label="推箱子棋盘">
        <div class="board__field">
          <div class="board__cells" id="cells" aria-hidden="true"></div>
          <div class="board__actors" id="actors"></div>
        </div>
      </div>
      <p class="soko__toast" id="toast" role="status" hidden></p>
    </div>

    <!-- 手机上用的方向键 -->
    <div class="pad" id="pad" role="group" data-i18n-aria="pad_aria" aria-label="方向键">
      <button class="pad__btn pad__btn--up" type="button" data-dir="up" data-i18n-aria="dir_up" aria-label="上">↑</button>
      <button class="pad__btn pad__btn--left" type="button" data-dir="left" data-i18n-aria="dir_left" aria-label="左">←</button>
      <button class="pad__btn pad__btn--down" type="button" data-dir="down" data-i18n-aria="dir_down" aria-label="下">↓</button>
      <button class="pad__btn pad__btn--right" type="button" data-dir="right" data-i18n-aria="dir_right" aria-label="右">→</button>
    </div>

    <div class="soko__actions">
      <button class="g-btn soko__btn--undo" id="btn-undo" type="button" data-i18n="btn_undo">↶ 撤销一步</button>
      <button class="g-btn" id="btn-restart" type="button" data-i18n="btn_restart">重来这一关</button>
    </div>

    <!-- 结算卡片 -->
    <div class="result" id="overlay" hidden>
      <div class="result__top">
        <div class="result__text">
          <h2 class="result__title" id="overlay-title">过关了</h2>
          <p class="result__sub" id="overlay-sub">所有箱子都放到了点上。</p>
        </div>
        <p class="result__stat">
          <span data-i18n="label_moves">步数</span>
          <strong id="overlay-moves">0</strong>
        </p>
        <p class="result__stat">
          <span data-i18n="label_time">用时</span>
          <strong id="overlay-time">0:00</strong>
        </p>
      </div>
      <div class="result__actions">
        <button class="ys-share-inline" type="button" data-share-open data-i18n="share_btn">分享</button>
        <button class="g-btn g-btn--primary result__btn" id="btn-next" type="button" data-i18n="btn_next">下一关</button>
      </div>
    </div>

    <p class="g-hint" data-i18n="hint_controls">
      方向键或 WASD 移动，推错了按撤销（U）。手机上滑一下，或按住下面的方向键。
    </p>

    <!-- 广告位 -->
    <div class="ad-container">
      <div class="ad-placeholder" data-i18n="ad_placeholder">广告位（申请 AdSense 后替换）</div>
    </div>
  </main>
