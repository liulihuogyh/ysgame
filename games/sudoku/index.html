  <!-- JavaScript -->
  <script src="js/sudoku.js"></script>

  <script>
    // 初始化游戏
    let game;
    
    window.addEventListener('DOMContentLoaded', () => {
      game = new SudokuGame();
      
      // 如果是第一次访问，显示难度选择菜单
      if (!localStorage.getItem('ysgame-sudoku-state')) {
        document.getElementById('main-menu').classList.add('show');
      } else {
        // 加载之前的游戏
        game.renderBoard();
        game.startTimer();
        game.updateStats();
      }
    });
  </script>
